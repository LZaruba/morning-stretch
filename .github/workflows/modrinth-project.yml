# Sync the Modrinth project page (summary, description, tags, license, links, icon,
# gallery) from docs/modrinth-project.json without releasing a new version.
# The release workflow runs the same sync on every release.

name: modrinth-project
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-24.04
    # MODRINTH_TOKEN is stored as a secret of the 'default' environment.
    environment: default
    steps:
      - name: checkout main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: sync Modrinth project page
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "::error::The MODRINTH_TOKEN secret of the default environment is not set"
            exit 1
          fi
          python3 tools/sync_modrinth_project.py
